<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 — Sliding Tile Puzzle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header: title, scores, new game button -->
    <div class="header">
      <div class="title-block">
        <h1>2048</h1>
        <p class="tagline">Join the tiles. Reach <strong>2048</strong>.</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Best</span>
          <span class="score-value" id="best">0</span>
        </div>
        <button id="newGameBtn" class="new-game-btn">🔄 New game</button>
      </div>
    </div>

    <!-- The board: background grid + animated tiles + overlay -->
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h2 id="overlayTitle">Game over!</h2>
          <p id="overlayMsg">No more moves. Nice run!</p>
          <button id="keepGoingBtn" class="new-game-btn" hidden>Keep going</button>
          <button id="overlayNewGameBtn" class="new-game-btn">🔄 Try again</button>
        </div>
      </div>
    </div>

    <p class="hint">⬆️⬇️⬅️➡️ Use arrow keys, WASD, or swipe</p>
    <p class="footer">Day 6 of my daily coding journey · built with vanilla JS</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
